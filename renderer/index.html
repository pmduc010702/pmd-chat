    };
  </script>
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      color: #f0ede5;
      font-family: 'DM Sans', system-ui, sans-serif;
      user-select: none;
    }

    /* ═══ Theme CSS variables ═══ */
    :root {
      --accent-rgb: 245 176 66;
      --bg-from: 31 29 26;
      --bg-to: 22 20 18;
      --bubble-1: #f5b042;

    }

      --accent-rgb: 244 114 182;
      --bg-from: 40 22 32;
      --bg-to: 28 16 24;
      --bubble-1: #f472b6;

      --bubble-3: #831843;
    }
    body[data-theme="cyberpunk"] {
      --accent-rgb: 167 139 250;

      --bg-to: 10 5 22;

      --bubble-3: #365314;
    }
    body[data-theme="mocha"] {

      --bg-to: 26 16 10;

    body[data-theme="ocean"] {

    /* Selectable text inside chat messages */
    input, textarea, .selectable, .selectable * { user-select: text; }

    .glass-panel {
      background: linear-gradient(155deg, rgb(var(--bg-from) / 0.985) 0%, rgb(var(--bg-to) / 1) 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);

      box-shadow:
        0 12px 40px -8px rgb(var(--accent-rgb) / 0.55),

<body>
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect, useRef, useCallback } from 'https://esm.sh/react@18';
    import ReactDOM from 'https://esm.sh/react-dom@18/client';
    import { marked } from 'https://esm.sh/marked@4';
    import hljs from 'https://esm.sh/highlight.js@11.10.0';

    const h = React.createElement;
    const electron = window.electronAPI;
    const isElectron = !!electron?.isElectron;

    marked.setOptions({
      highlight: (code, lang) => {
        try {
          if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
          return hljs.highlightAuto(code).value;
        } catch { return code; }
      },
      breaks: true, gfm: true,
    });
    const renderMd = (text) => marked.parse(text || '');

    const STORAGE_KEY = 'floating-chat-electron-v1';
    const loadState = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; } };
    const saveState = (s) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {} };
    const uid = () => Math.random().toString(36).slice(2, 10);

    // Merge embedded default config (from config.js) with stored state
    const DEFAULT = window.DEFAULT_CONFIG || { apiKeys: { gemini: '', groq: '', openrouter: '' }, provider: 'gemini', model: 'gemini-2.5-flash' };
    function getInitialState() {
      const stored = loadState();
      // Migrate old 'Hà Nội' default to 'Đà Nẵng'
      if (stored.weatherCity === 'Hà Nội') stored.weatherCity = 'Đà Nẵng';
      return {
        ...stored,
        apiKeys: {
          gemini: stored.apiKeys?.gemini || DEFAULT.apiKeys.gemini || '',
          groq: stored.apiKeys?.groq || DEFAULT.apiKeys.groq || '',
          openrouter: stored.apiKeys?.openrouter || DEFAULT.apiKeys.openrouter || '',
        },
        provider: stored.provider || DEFAULT.provider,
        model: stored.model || DEFAULT.model,
      };
    }

    const PROVIDERS = {
      gemini: {
        name: 'Gemini',
        models: [
          { id: 'gemini-2.5-flash', label: 'Gemini 2.5 Flash (1M context)' },
          { id: 'gemini-2.5-pro', label: 'Gemini 2.5 Pro' },
          { id: 'gemini-2.0-flash', label: 'Gemini 2.0 Flash' },
        ],
        keyUrl: 'https://aistudio.google.com/apikey',
      },
      groq: {
        name: 'Groq',
        models: [
          { id: 'llama-3.3-70b-versatile', label: 'Llama 3.3 70B' },
          { id: 'llama-3.1-8b-instant', label: 'Llama 3.1 8B (instant)' },
        ],
        keyUrl: 'https://console.groq.com/keys',
      },
      openrouter: {
        name: 'OpenRouter',
        models: [
          { id: 'deepseek/deepseek-chat-v3-0324:free', label: 'DeepSeek V3 (free)' },
          { id: 'meta-llama/llama-3.3-70b-instruct:free', label: 'Llama 3.3 70B (free)' },
          { id: 'qwen/qwen-2.5-72b-instruct:free', label: 'Qwen 2.5 72B (free)' },
          { id: 'google/gemini-2.0-flash-exp:free', label: 'Gemini 2.0 Flash (free)' },
        ],
        keyUrl: 'https://openrouter.ai/keys',
      },
    };

    const PERSONAS = [
      { id: 'default', name: 'Trợ lý', emoji: '✨', desc: 'Trợ lý AI đa năng',
        sys: 'Bạn là trợ lý AI thông minh, thân thiện và hữu ích. Trả lời ngắn gọn nhưng đầy đủ. Hỗ trợ tiếng Việt tự nhiên. Khi cần code, dùng markdown code block với ngôn ngữ chỉ định.' },
      { id: 'translator', name: 'Dịch giả', emoji: '🌐', desc: 'Dịch Việt ↔ Anh tự nhiên',
        sys: 'Bạn là dịch giả chuyên nghiệp. Tự động phát hiện ngôn ngữ và dịch Việt↔Anh tự nhiên. Chỉ trả về bản dịch, không giải thích trừ khi được hỏi.' },
      { id: 'writer', name: 'Biên tập', emoji: '✍️', desc: 'Sửa văn, viết lại, tóm tắt',
        sys: 'Bạn là biên tập viên giỏi tiếng Việt và Anh. Sửa chính tả, ngữ pháp, dấu câu, đề xuất cách viết tự nhiên hơn. Khi viết lại, đưa ra 2-3 phương án tone khác nhau.' },
      { id: 'coder', name: 'Lập trình viên', emoji: '💻', desc: 'Hỗ trợ code, debug',
        sys: 'Bạn là senior software engineer. Viết code rõ ràng, có comment khi cần. Giải thích ngắn gọn approach. Đề xuất edge cases. Ưu tiên giải pháp đơn giản, dễ maintain.' },
      { id: 'friend', name: 'Bạn nói chuyện', emoji: '☕', desc: 'Trò chuyện thoải mái',
        sys: 'Bạn là một người bạn thân thiện, biết lắng nghe. Nói chuyện tự nhiên, dùng từ ngữ đời thường. Có thể đùa nhẹ, đồng cảm khi chia sẻ. Tránh lên lớp, tránh dài dòng.' },
      { id: 'tutor', name: 'Tutor tiếng Anh', emoji: '📚', desc: 'Học tiếng Anh',
        sys: 'Bạn là giáo viên tiếng Anh kiên nhẫn cho người Việt. Sửa lỗi nhẹ nhàng, giải thích bằng tiếng Việt. Cho ví dụ, từ đồng nghĩa khi hỏi nghĩa từ. Luôn khuyến khích.' },
    ];

    const COMMANDS = [
      { cmd: '/dịch', label: 'Dịch', desc: 'Dịch Việt ↔ Anh tự động',
        transform: t => `Tự động phát hiện ngôn ngữ và dịch văn bản sau. Chỉ trả về bản dịch:\n\n${t}` },
      { cmd: '/tóm', label: 'Tóm tắt', desc: 'Tóm tắt văn bản',
        transform: t => `Tóm tắt văn bản sau thành 3-5 gạch đầu dòng ngắn gọn:\n\n${t}` },
      { cmd: '/giải thích', label: 'Giải thích', desc: 'Giải thích dễ hiểu',
        transform: t => `Giải thích nội dung sau bằng từ ngữ đơn giản, kèm ví dụ nếu cần:\n\n${t}` },
      { cmd: '/sửa', label: 'Sửa lỗi', desc: 'Sửa chính tả, ngữ pháp',
        transform: t => `Sửa lỗi chính tả, ngữ pháp, dấu câu. Giữ nguyên ý và giọng văn. Chỉ trả về bản đã sửa:\n\n${t}` },
      { cmd: '/viết lại', label: 'Viết lại', desc: '3 phương án khác tone',
        transform: t => `Viết lại văn bản sau theo 3 tone khác nhau: (1) formal, (2) casual, (3) ngắn gọn. Đánh số rõ ràng:\n\n${t}` },
      { cmd: '/code', label: 'Code', desc: 'Trợ giúp lập trình',
        transform: t => `Là senior dev, giúp tôi với yêu cầu code sau:\n\n${t}` },
      { cmd: '/ảnh', label: 'Tạo ảnh', desc: 'Tạo ảnh AI (Pollinations, free)',
        transform: t => t, special: 'image-gen' },
    ];

    const parseCommand = (input) => {
      const trimmed = input.trimStart();
      for (const c of COMMANDS) {
        const lower = c.cmd.toLowerCase();
        if (trimmed.toLowerCase().startsWith(lower + ' ')) {
          const rest = trimmed.slice(c.cmd.length + 1).trim();
          if (rest) return { command: c, text: rest, transformed: c.transform(rest) };
        }
      }
      return null;
    };
    const matchCommands = (input) => {
      const trimmed = input.trimStart();
      if (!trimmed.startsWith('/')) return [];
      const q = trimmed.toLowerCase().split(' ')[0];
      return COMMANDS.filter(c => c.cmd.toLowerCase().startsWith(q));
    };

    // ── Template matching (@-autocomplete) ──
    const matchTemplates = (input, templates) => {
      const lastAt = input.lastIndexOf('@');
      if (lastAt === -1) return { matches: [], query: '', startIdx: -1 };
      const after = input.slice(lastAt + 1);
      if (/\s/.test(after)) return { matches: [], query: '', startIdx: -1 };
      const q = after.toLowerCase();
      const matches = templates.filter(t => t.name.toLowerCase().startsWith(q));
      return { matches, query: after, startIdx: lastAt };
    };

    // ── Image generation via Pollinations (free, no API key) ──
    async function generateImage(prompt) {
      const seed = Math.floor(Math.random() * 1000000);
      const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}&nologo=true`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Tạo ảnh thất bại (${res.status})`);
      const blob = await res.blob();
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          resolve({
            id: uid(),
            dataUrl,
            base64: dataUrl.split(',')[1],
            mimeType: blob.type || 'image/jpeg',
            name: `pmd-gen-${Date.now()}.jpg`,
          });
        };
        reader.onerror = () => reject(new Error('Đọc ảnh lỗi'));
        reader.readAsDataURL(blob);
      });
    }

    async function* parseSSE(res, extractText) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
          const t = line.trim();
          if (!t.startsWith('data:')) continue;
          const data = t.slice(5).trim();
          if (!data) continue;
          const text = extractText(data);
          if (text === null) return;
          if (text) yield text;
        }
      }
    }

    async function* streamGemini({ model, apiKey, systemPrompt, messages, signal, useWebSearch }) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${apiKey}`;
      const contents = messages.map(m => {
        const parts = [];
        if (m.attachments?.length) {
          for (const a of m.attachments) {
            parts.push({ inline_data: { mime_type: a.mimeType, data: a.base64 || (a.dataUrl && a.dataUrl.split(',')[1]) || '' } });
          }
        }
        if (m.content) parts.push({ text: m.content });
        if (parts.length === 0) parts.push({ text: '' });
        return { role: m.role === 'assistant' ? 'model' : 'user', parts };
      });
      const body = { contents, generationConfig: { temperature: 0.7, maxOutputTokens: 8192 } };
      if (systemPrompt?.trim()) body.systemInstruction = { parts: [{ text: systemPrompt }] };
      if (useWebSearch) body.tools = [{ google_search: {} }];

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal,
      });
      if (!res.ok) throw new Error(`Gemini (${res.status}): ${(await res.text()).slice(0, 200)}`);

      // Inline SSE parse so we can also capture grounding metadata
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let grounding = null;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
          const t = line.trim();
          if (!t.startsWith('data:')) continue;
          const data = t.slice(5).trim();
          if (!data) continue;
          try {
            const parsed = JSON.parse(data);
            const text = parsed?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) yield text;
            const gm = parsed?.candidates?.[0]?.groundingMetadata;
            if (gm) {
              grounding = {
                chunks: gm.groundingChunks || [],
                queries: gm.webSearchQueries || [],
              };
            }
          } catch {}
        }
      }
      if (grounding) yield { _grounding: grounding };
    }

    async function* streamOpenAI({ provider, model, apiKey, systemPrompt, messages, signal }) {
      const url = provider === 'groq'
        ? 'https://api.groq.com/openai/v1/chat/completions'
        : 'https://openrouter.ai/api/v1/chat/completions';
      const oaiMessages = [];
      if (systemPrompt?.trim()) oaiMessages.push({ role: 'system', content: systemPrompt });
      for (const m of messages) {
        if (m.attachments?.length && m.role === 'user') {
          oaiMessages.push({
            role: m.role,
            content: [
              ...(m.content ? [{ type: 'text', text: m.content }] : []),
              ...m.attachments.map(a => ({
                type: 'image_url',
                image_url: { url: a.dataUrl || `data:${a.mimeType};base64,${a.base64}` },
              })),
            ],
          });
        } else {
          oaiMessages.push({ role: m.role, content: m.content });
        }
      }
      const headers = { 'Content-Type': 'application/json', Authorization: `Bearer ${apiKey}` };
      if (provider === 'openrouter') {
        headers['HTTP-Referer'] = 'https://floating-ai-chat.local';
        headers['X-Title'] = 'Floating AI Chat';
      }
      const res = await fetch(url, {
        method: 'POST', headers,
        body: JSON.stringify({ model, messages: oaiMessages, stream: true, temperature: 0.7 }),
        signal,
      });
      if (!res.ok) throw new Error(`${provider} (${res.status}): ${(await res.text()).slice(0, 200)}`);
      yield* parseSSE(res, data => {
        if (data === '[DONE]') return null;
        try {
          const p = JSON.parse(data);
          return p?.choices?.[0]?.delta?.content || '';
        } catch { return ''; }
      });
    }

    async function* streamChat(opts) {
      if (!opts.apiKey) throw new Error(`Chưa có API key cho ${PROVIDERS[opts.provider].name}. Mở Cài đặt.`);
      if (opts.provider === 'gemini') yield* streamGemini(opts);
      else {
        if (opts.useWebSearch) {
          // Web search chỉ hoạt động với Gemini (Google Grounding). Chuyển sang Gemini hoặc tắt search.
        }
        yield* streamOpenAI(opts);
      }
    }

    // ── Icons ──
    const svg = (path, w = 16) => h('svg', { width: w, height: w, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },

    function useVoice(setText, getCurrent) {
      const [listening, setListening] = useState(false);
      const recogRef = useRef(null);
      const toggle = useCallback(() => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { alert('Trình duyệt không hỗ trợ nhận diện giọng nói.'); return; }
        if (listening) { recogRef.current?.stop(); return; }
        const recog = new SR();
        recog.lang = 'vi-VN'; recog.continuous = true; recog.interimResults = true;
        const start = getCurrent();
        let finalText = start + (start && !start.endsWith(' ') ? ' ' : '');
        recog.onresult = (e) => {
          let interim = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const t = e.results[i][0].transcript;
            if (e.results[i].isFinal) finalText += t + ' ';
            else interim += t;
          }
          setText(finalText + interim);
        };
        recog.onend = () => setListening(false);
        recog.onerror = () => setListening(false);
        recog.start();
        recogRef.current = recog;
        setListening(true);
      }, [listening, setText, getCurrent]);
      return [listening, toggle];
    }

            ...c,
            messages: (c.messages || []).map(m => {
              if (!m.attachments?.length) return m;
              return {
                ...m,
                attachments: m.attachments.map(a => ({ id: a.id, dataUrl: a.dataUrl, mimeType: a.mimeType, name: a.name })),
              };
            }),

        }, 400);

        }

      })();
      const modelLimits = { 'gemini-2.5-flash': 1048576, 'gemini-2.5-pro': 1048576, 'gemini-2.0-flash': 1048576 };

        const intendedConvId = conversations.find(c => c.id === activeConvId)?.id || uid();

        const userMsg = { id: uid(), role: 'user', content: trimmed, ...(attachments.length ? { attachments } : {}) };

            ));

    function Bubble({ onClick, isStreaming }) {
      const dragRef = useRef(null);

      const onMouseDown = (e) => {
        if (e.button !== 0) return;
        dragRef.current = {
          startX: e.screenX, startY: e.screenY,
          lastX: e.screenX, lastY: e.screenY,
          didDrag: false,
        };
        const onMove = (ev) => {
          const s = dragRef.current;
          if (!s) return;
          const totalDx = Math.abs(ev.screenX - s.startX);
          const totalDy = Math.abs(ev.screenY - s.startY);
          if (totalDx > 5 || totalDy > 5) s.didDrag = true;
          if (s.didDrag) {
            const dx = ev.screenX - s.lastX;
            const dy = ev.screenY - s.lastY;
            if ((dx || dy) && isElectron && electron.moveWindowBy) {
              electron.moveWindowBy(dx, dy);
            }
            s.lastX = ev.screenX;
            s.lastY = ev.screenY;
          }
        };
        const onUp = () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      };

      const handleClick = () => {
        const s = dragRef.current;
        dragRef.current = null;
        if (s?.didDrag) return;  // it was a drag, skip click
        onClick?.();
      };

      return h('button', {
        onMouseDown,
        onClick: handleClick,
        className: 'bubble-pop relative w-16 h-16 rounded-full glass-bubble flex items-center justify-center cursor-pointer hover:scale-105 active:scale-95 transition',
        title: 'Click để mở · Kéo để di chuyển',

        h('div', { className: `text-ink-950 ${isStreaming ? 'ring-spin' : ''}`, style: { pointerEvents: 'none' } }, I.sparkles),

          className: 'absolute -inset-3 rounded-full opacity-40 blur-2xl pointer-events-none',
          style: { background: 'radial-gradient(circle, rgb(var(--accent-rgb)) 0%, transparent 70%)' },
        }),
      );

    async function fetchWeather(city) {
      const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=vi&format=json`);
      const geoData = await geo.json();
      if (!geoData.results?.length) throw new Error(`Không tìm thấy "${city}"`);
      const { latitude, longitude, name, country } = geoData.results[0];
      const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&timezone=auto`);
      const wd = await w.json();
      return {
        city: name, country,
        temp: wd.current.temperature_2m,
        code: wd.current.weather_code,
        wind: wd.current.wind_speed_10m,
        humidity: wd.current.relative_humidity_2m,
        time: wd.current.time,
      };
    }

    function greetByHour() {
      const h = new Date().getHours();
      if (h < 11) return { txt: 'Chào buổi sáng', emoji: '☀️' };
      if (h < 13) return { txt: 'Chào buổi trưa', emoji: '🌤️' };
      if (h < 18) return { txt: 'Chào buổi chiều', emoji: '☕' };
      if (h < 22) return { txt: 'Chào buổi tối', emoji: '🌆' };
      return { txt: 'Khuya rồi nhỉ', emoji: '🌙' };
    }

      return h('div', { ref, className: 'flex-1 min-h-0 overflow-y-auto py-4 space-y-3' },

    function Message({ message, isStreaming, isLast, onRegenerate, onEdit }) {
      const [copied, setCopied] = useState(false);
      const [editing, setEditing] = useState(false);
      const [editText, setEditText] = useState(message.content);
      const [speaking, setSpeaking] = useState(false);
      const isUser = message.role === 'user';

      const copy = async () => {
        await navigator.clipboard.writeText(message.content);
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      };

      const speak = () => {
        if (!window.speechSynthesis) return;
        if (speaking || window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
          setSpeaking(false);
          return;
        }
        // Strip markdown for cleaner speech
        const clean = (message.content || '').replace(/[*_`#>\[\]()]/g, ' ').replace(/\s+/g, ' ').trim();
        if (!clean) return;
        const utter = new SpeechSynthesisUtterance(clean);
        utter.lang = 'vi-VN';
        utter.rate = 1.0;
        utter.pitch = 1.0;
        utter.onend = () => setSpeaking(false);
        utter.onerror = () => setSpeaking(false);
        window.speechSynthesis.speak(utter);
        setSpeaking(true);
      };

      const saveEdit = () => {
        if (editText.trim() === message.content.trim()) { setEditing(false); return; }
        onEdit?.(message.id, editText.trim());
        setEditing(false);
      };

      const isImage = (a) => a.mimeType?.startsWith('image/');
      const imgAttachments = message.attachments?.filter(isImage) || [];
      const fileAttachments = message.attachments?.filter(a => !isImage(a)) || [];

      return h('div', { className: `group flex ${isUser ? 'justify-end' : 'justify-start'} px-4 fade-in selectable` },

              title: a.name,
            },
              h('span', { className: 'text-amber-glow shrink-0' }, I.file),

            ))
          ),
          editing
            ? h('div', { className: 'flex flex-col gap-1.5' },
                h('textarea', {
                  value: editText,
                  onChange: e => setEditText(e.target.value),
                  autoFocus: true,
                  rows: Math.min(8, editText.split('\n').length + 1),
                  className: 'rounded-2xl px-4 py-2.5 bg-ink-800/90 border border-amber-glow/40 text-ink-100 text-sm focus:outline-none resize-none w-[280px]',
                }),
                h('div', { className: 'flex justify-end gap-2 text-xs' },
                  h('button', {
                    onClick: () => { setEditing(false); setEditText(message.content); },

                  }, 'Hủy'),

            : (message.content || (!imgAttachments.length && !fileAttachments.length)) && h('div', {
                className: `rounded-2xl px-4 py-2.5 ${

                      : 'bg-ink-800/70 text-ink-100 rounded-bl-md border border-white/5'
                }`,
              },
                isUser
                  ? h('div', { style: { whiteSpace: 'pre-wrap', wordBreak: 'break-word', fontSize: '14px', lineHeight: '1.5' } }, message.content)

    function ChatInput({ onSend, onStop, isStreaming, templates, pendingAttachment, clearPendingAttachment }) {
      const [text, setText] = useState('');
      const [attachments, setAttachments] = useState([]);
      const taRef = useRef(null);
      const fileRef = useRef(null);
      const textRef = useRef(text);
      useEffect(() => { textRef.current = text; }, [text]);
      const [listening, toggleVoice] = useVoice(setText, () => textRef.current);

      // Receive attachment from Electron screenshot
      useEffect(() => {
        if (pendingAttachment) {
          setAttachments(prev => [...prev, pendingAttachment]);
          clearPendingAttachment();
        }
      }, [pendingAttachment, clearPendingAttachment]);

      useEffect(() => {
        const ta = taRef.current;
        if (!ta) return;
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
      }, [text]);

      const addFile = (file) => {
        if (!file) return;
        const isImage = file.type.startsWith('image/');
        const isPdf = file.type === 'application/pdf';
        const isText = file.type.startsWith('text/') || /\.(txt|md|csv|json|js|ts|py|html|css|xml|log)$/i.test(file.name);
        if (!isImage && !isPdf && !isText) {
          alert(`Loại file không hỗ trợ: ${file.type || file.name}`);
          return;
        }
        if (file.size > 20 * 1024 * 1024) { alert('File quá lớn (>20MB)'); return; }
        const reader = new FileReader();
        reader.onload = (e) => {
          const dataUrl = e.target.result;
          const base64 = dataUrl.split(',')[1];
          setAttachments(prev => [...prev, {
            id: uid(),
            mimeType: file.type || (isPdf ? 'application/pdf' : 'text/plain'),
            base64, dataUrl,
            name: file.name || 'file',
            size: file.size,
          }]);
        };
        reader.readAsDataURL(file);
      };

      const onPaste = (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        for (const item of items) {
          if (item.type.startsWith('image/')) {
            e.preventDefault();
            const file = item.getAsFile();
            if (file) addFile(file);
          }
        }
      };

      const onFilePick = (e) => {
        const files = e.target.files;
        if (!files) return;
        for (const f of files) addFile(f);
        e.target.value = '';
      };

      const removeAttachment = (id) => setAttachments(prev => prev.filter(a => a.id !== id));

      const suggestions = matchCommands(text);
      const showSuggestions = suggestions.length > 0 && text.startsWith('/');
      const tmplMatch = matchTemplates(text, templates);
      const showTemplates = tmplMatch.matches.length > 0;

      const applyTemplate = (t) => {
        const before = text.slice(0, tmplMatch.startIdx);
        setText(before + t.content);
        setTimeout(() => taRef.current?.focus(), 0);
      };

      const canSubmit = (text.trim() || attachments.length > 0) && !isStreaming;
      const submit = () => {
        if (!canSubmit) return;
        onSend(text, attachments);
        setText('');
        setAttachments([]);
      };
      const onKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
        if (e.key === 'Tab' && showSuggestions) { e.preventDefault(); setText(suggestions[0].cmd + ' '); taRef.current?.focus(); }
        if (e.key === 'Tab' && showTemplates) { e.preventDefault(); applyTemplate(tmplMatch.matches[0]); }
      };

      const isImg = (a) => a.mimeType?.startsWith('image/');

      return h('div', { className: 'relative shrink-0' },
        showSuggestions && h('div', { className: 'absolute bottom-full left-3 right-3 mb-2 glass-panel rounded-xl overflow-hidden shadow-2xl fade-in' },
          suggestions.map(s => h('button', {
            key: s.cmd, onClick: () => { setText(s.cmd + ' '); taRef.current?.focus(); },
            className: 'w-full text-left px-3 py-2 hover:bg-white/5 flex items-center justify-between gap-3 border-b border-white/5 last:border-b-0',
          },
            h('div', { className: 'flex items-center gap-2 min-w-0' },
              h('span', { className: 'font-mono text-amber-glow text-sm' }, s.cmd),
              h('span', { className: 'text-ink-300 text-sm' }, s.label),
            ),
            h('span', { className: 'text-ink-400 text-xs truncate' }, s.desc),
          )),
          h('div', { className: 'px-3 py-1 text-[10px] text-ink-500 bg-black/20' }, 'Tab để chọn nhanh')
        ),
        showTemplates && h('div', { className: 'absolute bottom-full left-3 right-3 mb-2 glass-panel rounded-xl overflow-hidden shadow-2xl fade-in' },
          h('div', { className: 'px-3 py-1.5 text-[10px] text-amber-glow/80 bg-amber-glow/5 uppercase tracking-wider flex items-center gap-1' },
            I.at, 'Mẫu prompt'
          ),
          tmplMatch.matches.slice(0, 5).map(t => h('button', {
            key: t.id, onClick: () => applyTemplate(t),
            className: 'w-full text-left px-3 py-2 hover:bg-white/5 flex items-center gap-2 border-b border-white/5 last:border-b-0',
          },
            h('span', { className: 'font-mono text-amber-glow text-sm shrink-0' }, '@' + t.name),
            h('span', { className: 'text-ink-400 text-xs truncate' }, t.content.slice(0, 60))
          )),
          h('div', { className: 'px-3 py-1 text-[10px] text-ink-500 bg-black/20' }, 'Tab để chọn · thêm trong Cài đặt → Mẫu')
        ),

        attachments.length > 0 && h('div', { className: 'flex flex-wrap gap-2 px-3 pt-2' },
          attachments.map(a => h('div', { key: a.id, className: 'relative' },
            isImg(a)
              ? h('img', {
                  src: a.dataUrl,
                  className: 'w-14 h-14 rounded-lg object-cover border border-white/10',
                  alt: a.name,
                })
              : h('div', {
                  className: 'h-14 px-2.5 flex items-center gap-1.5 bg-ink-800/60 border border-white/10 rounded-lg max-w-[140px]',
                  title: a.name,
                },
                  h('span', { className: 'text-amber-glow shrink-0' }, I.file),
                  h('span', { className: 'text-[11px] text-ink-200 truncate' }, a.name),
                ),
            h('button', {
              onClick: () => removeAttachment(a.id),
              className: 'absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-500/90 hover:bg-red-500 text-white text-xs font-bold flex items-center justify-center transition',
              title: 'Bỏ',
            }, '×')
          ))
        ),
        h('input', {
          ref: fileRef, type: 'file',
          accept: 'image/*,.pdf,application/pdf,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.log,text/*',
          multiple: true,
          onChange: onFilePick, style: { display: 'none' },
        }),
        h('div', { className: 'flex items-end gap-1.5 px-3 pb-3 pt-2 border-t border-white/5' },
          h('button', {
            onClick: () => fileRef.current?.click(),
            className: 'shrink-0 w-9 h-9 rounded-full flex items-center justify-center transition text-ink-400 hover:text-amber-glow hover:bg-white/5',
            title: 'Thêm ảnh/PDF/text (Ctrl+V dán ảnh)',
          }, I.paperclip),
          isElectron && h('button', {
            onClick: () => electron.startScreenshot && electron.startScreenshot(),
            className: 'shrink-0 w-9 h-9 rounded-full flex items-center justify-center transition text-ink-400 hover:text-amber-glow hover:bg-white/5',
            title: 'Chụp vùng màn hình (Ctrl+Shift+S)',
          }, I.camera),
          h('button', {
            onClick: toggleVoice,
            className: `shrink-0 w-9 h-9 rounded-full flex items-center justify-center transition ${
              listening ? 'bg-red-500/20 text-red-300 pulse-ring' : 'text-ink-400 hover:text-amber-glow hover:bg-white/5'
            }`,
            title: listening ? 'Dừng ghi âm' : 'Nói (tiếng Việt)',
          }, I.mic),
          h('textarea', {
            ref: taRef, value: text, onChange: e => setText(e.target.value), onKeyDown, onPaste,
            placeholder: 'Nhắn... (/ lệnh, @ mẫu, Ctrl+V dán ảnh)',
            rows: 1,
            className: 'flex-1 bg-ink-800/60 border border-white/10 rounded-2xl px-4 py-2.5 text-ink-100 placeholder-ink-500 text-sm focus:outline-none focus:border-amber-glow/40 focus:bg-ink-800/80 resize-none transition',
            style: { maxHeight: '140px' },
          }),
          isStreaming
            ? h('button', { onClick: onStop, className: 'shrink-0 w-9 h-9 rounded-full bg-red-500/80 hover:bg-red-500 text-white flex items-center justify-center transition', title: 'Dừng' }, I.stop)
            : h('button', { onClick: submit, disabled: !canSubmit,
                className: 'shrink-0 w-9 h-9 rounded-full flex items-center justify-center transition bg-amber-glow text-ink-950 hover:brightness-110 disabled:bg-ink-700 disabled:text-ink-500 disabled:cursor-not-allowed',
                title: 'Gửi (Enter)' }, I.send),
        )
      );
    }

    function exportConvToMarkdown(conv) {
      const lines = [`# ${conv.title || 'Cuộc trò chuyện'}`, '', `_${new Date(conv.updatedAt).toLocaleString('vi-VN')}_`, ''];
      for (const m of conv.messages) {
        const role = m.role === 'user' ? '🧑 **Bạn**' : '🤖 **AI**';
        lines.push(`## ${role}`, '');
        if (m.attachments?.length) {
          for (const a of m.attachments) {
            lines.push(`> 📎 _${a.name || 'attachment'}_`);
          }
          lines.push('');
        }
        if (m.content) lines.push(m.content, '');
        if (m.grounding?.chunks?.length) {
          lines.push('**Nguồn web:**');
          m.grounding.chunks.slice(0, 5).forEach((c, i) => {
            lines.push(`${i + 1}. [${c.web?.title || c.web?.uri}](${c.web?.uri})`);
          });
          lines.push('');
        }
        lines.push('---', '');
      }
      const md = lines.join('\n');
      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const safe = (conv.title || 'chat').replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);
      a.download = `${safe}.md`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

                            },
                            className: 'p-1.5 rounded text-ink-400 hover:text-red-400 hover:bg-red-500/10 transition',
                            title: 'Xóa',
                          }, I.trash)
                    )
                  );
                })
          ),
          // Clear all (footer)
          conversations.length > 0 && h('div', { className: 'shrink-0 px-3 py-2 border-t border-white/5' },
            h('button', {
              type: 'button',
              onClick: (e) => {
                e.preventDefault(); e.stopPropagation();
                if (confirmingId === '__all__') {
                  conversations.forEach(c => onDelete(c.id));
                  setConfirmingId(null);
                } else {
                  setConfirmingId('__all__');
                }
              },
              className: confirmingId === '__all__'
                ? 'w-full text-[11px] py-1.5 rounded-lg bg-red-500 text-white font-semibold animate-pulse'
                : 'w-full text-[11px] py-1.5 rounded-lg text-ink-500 hover:text-red-400 hover:bg-red-500/10 transition',
            }, confirmingId === '__all__' ? 'Bấm lại để xóa TẤT CẢ' : `🗑 Xóa tất cả (${conversations.length})`),
          )
        )
      );
    }

    function Settings({ provider, model, apiKeys, memoryFacts, templates, theme, onTheme, onProvider, onModel, onApiKey, onAddFact, onRemoveFact, onAddTemplate, onUpdateTemplate, onRemoveTemplate, onClose }) {
      const [tab, setTab] = useState('about');
      const [newFact, setNewFact] = useState('');
      const [newTmplName, setNewTmplName] = useState('');
      const [newTmplContent, setNewTmplContent] = useState('');
      const [editingId, setEditingId] = useState(null);

      const saveTemplate = () => {
        if (!newTmplName.trim() || !newTmplContent.trim()) return;
        if (editingId) {
          onUpdateTemplate(editingId, { name: newTmplName.trim(), content: newTmplContent });
          setEditingId(null);
        } else {
          onAddTemplate({ name: newTmplName.trim(), content: newTmplContent });
        }
        setNewTmplName('');
        setNewTmplContent('');
      };

      return h(React.Fragment, null,
        h('div', { className: 'absolute inset-0 bg-black/50 z-30 fade-in', onClick: onClose }),
        h('div', { className: 'absolute inset-3 glass-panel rounded-2xl z-40 flex flex-col overflow-hidden fade-in' },
          h('div', { className: 'flex items-center justify-between px-4 py-3 border-b border-white/5' },
            h('h2', { className: 'text-xl text-ink-100', style: { fontFamily: 'Instrument Serif, serif' } }, 'Cài đặt'),
            h('button', { onClick: onClose, className: 'text-ink-400 hover:text-ink-100' }, I.close),
          ),
          h('div', { className: 'flex border-b border-white/5 px-2 overflow-x-auto' },
            [
              { id: 'about', label: 'Giới thiệu', icon: I.heart },
              { id: 'theme', label: 'Giao diện', icon: I.sparkle },
              { id: 'memory', label: 'Bộ nhớ', icon: I.brain },
              { id: 'api', label: 'API', icon: I.key },
              { id: 'model', label: 'Mô hình', icon: I.cpu },
              { id: 'templates', label: 'Mẫu', icon: I.at },
            ].map(t => h('button', {
              key: t.id, onClick: () => setTab(t.id),
              className: `flex items-center gap-1 px-2.5 py-2.5 text-xs border-b-2 transition whitespace-nowrap ${
                tab === t.id ? 'border-amber-glow text-amber-glow' : 'border-transparent text-ink-400 hover:text-ink-200'
              }`,
            }, t.icon, t.label))
          ),
          h('div', { className: 'flex-1 min-h-0 overflow-y-auto p-4 selectable' },
            tab === 'api' && h('div', { className: 'space-y-4' },
              h('p', { className: 'text-xs text-ink-400' }, 'API key đã được cấu hình sẵn. Bạn có thể dán key của riêng bạn để override.'),
              Object.entries(PROVIDERS).map(([id, p]) => h('div', { key: id, className: 'space-y-1.5' },
                h('div', { className: 'flex items-center justify-between' },
                  h('label', { className: 'text-sm font-medium text-ink-200 flex items-center gap-2' }, p.name,
                    provider === id && h('span', { className: 'text-[10px] px-1.5 py-0.5 rounded bg-amber-glow/20 text-amber-glow' }, 'đang dùng'),
                    apiKeys[id] && h('span', { className: 'text-[10px] px-1.5 py-0.5 rounded bg-green-500/20 text-green-300' }, '✓ có key'),
                  ),
                  h('a', { href: p.keyUrl, target: '_blank', className: 'text-[11px] text-amber-glow hover:underline flex items-center gap-0.5' },
                    'lấy key riêng', I.external),
                ),
                h('div', { className: 'flex gap-2' },
                  h('input', {
                    type: 'password',
                    value: apiKeys[id] || '',
                    onChange: e => onApiKey(id, e.target.value),
                    placeholder: 'Dán key của bạn để override...',
                    autoComplete: 'off',
                    className: 'flex-1 bg-ink-800/60 border border-white/10 rounded-lg px-3 py-1.5 text-sm text-ink-100 placeholder-ink-500 focus:outline-none focus:border-amber-glow/40 font-mono',
                  }),
                  h('button', {
                    onClick: () => onProvider(id), disabled: provider === id,
                    className: 'px-3 py-1.5 text-xs rounded-lg border border-white/10 text-ink-300 hover:border-amber-glow/40 hover:text-amber-glow disabled:opacity-40 transition',
                  }, 'chọn'),
                )
              )),
              h('div', { className: 'bg-ink-800/40 border border-white/5 rounded-lg p-3 text-[11px] text-ink-400 leading-relaxed' },
                '🔒 Key mặc định đã ẩn để bảo mật. Nếu hết quota, lấy key riêng (link "lấy key riêng" bên phải) và dán vào để override.'
              )
            ),
            tab === 'model' && h('div', { className: 'space-y-4' },
              h('div', null,
                h('label', { className: 'text-sm text-ink-200 block mb-2' }, 'Nhà cung cấp'),
                h('div', { className: 'grid grid-cols-3 gap-2' },
                  Object.entries(PROVIDERS).map(([id, p]) => h('button', {
                    key: id, onClick: () => onProvider(id),
                    className: `px-2 py-2 rounded-lg text-xs border transition ${
                      provider === id ? 'border-amber-glow/50 bg-amber-glow/10 text-amber-glow' : 'border-white/10 text-ink-300 hover:border-white/20'
                    }`,
                  }, p.name))
                ),
              ),
              h('div', null,
                h('label', { className: 'text-sm text-ink-200 block mb-2' }, 'Mô hình'),
                h('select', {
                  value: model, onChange: e => onModel(e.target.value),
                  className: 'w-full bg-ink-800/60 border border-white/10 rounded-lg px-3 py-2 text-sm text-ink-100 focus:outline-none focus:border-amber-glow/40',
                }, PROVIDERS[provider].models.map(m => h('option', { key: m.id, value: m.id }, m.label))
                )
              ),
              h('div', { className: 'bg-amber-glow/5 border border-amber-glow/20 rounded-lg p-3' },
                h('p', { className: 'text-xs text-ink-300 leading-relaxed' },
                  '💡 ', h('strong', { className: 'text-amber-glow' }, 'Gemini 2.5 Flash'),
                  ' có context 1M token, vision, web search grounding — tốt nhất cho app này.', h('br'), h('br'),
                  h('strong', { className: 'text-amber-glow' }, 'Web search 🌐'), ' và ', h('strong', { className: 'text-amber-glow' }, 'PDF upload'),
                  ' chỉ hoạt động với Gemini.'
                )
              )
            ),
            tab === 'theme' && h('div', { className: 'space-y-3' },
              h('p', { className: 'text-xs text-ink-400' }, 'Chọn giao diện. Đổi ngay, không cần restart.'),
              h('div', { className: 'grid grid-cols-2 gap-2' },
                [
                  { id: 'amber', name: 'Dark Amber', emoji: '🌅', from: '#1f1d1a', to: '#161412', accent: '#f5b042' },
                  { id: 'sakura', name: 'Sakura', emoji: '🌸', from: '#281620', to: '#1c1018', accent: '#f472b6' },
                  { id: 'cyberpunk', name: 'Cyberpunk', emoji: '💜', from: '#0f081e', to: '#0a0516', accent: '#a78bfa' },
                  { id: 'forest', name: 'Forest', emoji: '🌲', from: '#121a10', to: '#0c140c', accent: '#84cc16' },
                  { id: 'mocha', name: 'Mocha', emoji: '☕', from: '#281a12', to: '#1a100a', accent: '#d97706' },
                  { id: 'ocean', name: 'Ocean', emoji: '🌊', from: '#0c1a20', to: '#081218', accent: '#06b6d4' },
                ].map(t => h('button', {
                  key: t.id,
                  onClick: () => onTheme(t.id),
                  className: `relative rounded-xl p-3 text-left transition border-2 ${
                    theme === t.id ? 'border-amber-glow' : 'border-white/10 hover:border-white/20'
                  }`,
                  style: { background: `linear-gradient(155deg, ${t.from}, ${t.to})` },
                },
                  h('div', { className: 'flex items-center gap-2 mb-2' },
                    h('span', { className: 'text-xl' }, t.emoji),
                    h('span', { className: 'text-sm font-medium text-ink-100' }, t.name),
                  ),
                  h('div', { className: 'flex items-center gap-1.5' },
                    h('div', { className: 'w-5 h-5 rounded-full shrink-0', style: { background: t.accent, boxShadow: `0 0 8px ${t.accent}66` } }),
                    h('div', { className: 'text-[10px] text-ink-400 font-mono' }, t.accent),
                  ),
                  theme === t.id && h('span', {
                    className: 'absolute top-1.5 right-1.5 w-5 h-5 rounded-full bg-amber-glow text-ink-950 flex items-center justify-center text-[10px] font-bold',
                  }, '✓')
                ))
              ),
              h('div', { className: 'bg-amber-glow/5 border border-amber-glow/20 rounded-lg p-3 mt-3' },
                h('p', { className: 'text-xs text-ink-300 leading-relaxed' },
                  '✨ Theme đổi mọi nơi: bubble, panel, message, accent color, glow… Không restart, không tải lại.'
                )
              )
            ),
            tab === 'memory' && h('div', { className: 'space-y-3' },
              h('p', { className: 'text-xs text-ink-400' }, 'Những điều bạn muốn AI nhớ qua mọi cuộc trò chuyện. Tự động chèn vào prompt.'),
              h('div', { className: 'flex gap-2' },
                h('input', {
                  type: 'text', value: newFact, onChange: e => setNewFact(e.target.value),
                  onKeyDown: e => { if (e.key === 'Enter' && newFact.trim()) { onAddFact(newFact.trim()); setNewFact(''); } },
                  placeholder: 'VD: Tôi thích trả lời ngắn gọn, súc tích',
                  className: 'flex-1 bg-ink-800/60 border border-white/10 rounded-lg px-3 py-1.5 text-sm text-ink-100 placeholder-ink-500 focus:outline-none focus:border-amber-glow/40',
                }),
                h('button', {
                  onClick: () => { if (newFact.trim()) { onAddFact(newFact.trim()); setNewFact(''); } },
                  className: 'px-3 py-1.5 rounded-lg bg-amber-glow text-ink-950 text-sm font-medium hover:brightness-110',
                }, I.plus),
              ),
              h('div', { className: 'space-y-1.5' },
                memoryFacts.length === 0
                  ? h('p', { className: 'text-center text-ink-500 text-sm py-6' }, 'Chưa có thông tin nào')
                  : memoryFacts.map((f, i) => h('div', { key: i, className: 'flex items-start gap-2 px-3 py-2 bg-ink-800/40 rounded-lg group' },
                      h('span', { className: 'text-amber-glow text-xs mt-0.5' }, (i + 1) + '.'),
                      h('span', { className: 'flex-1 text-sm text-ink-200' }, f),
                      h('button', { onClick: () => onRemoveFact(i), className: 'opacity-0 group-hover:opacity-100 text-ink-500 hover:text-red-400 transition' }, I.trash)
                    ))
              )
            ),
            tab === 'templates' && h('div', { className: 'space-y-3' },
              h('p', { className: 'text-xs text-ink-400' }, 'Mẫu prompt hay dùng. Gõ ', h('span', { className: 'font-mono text-amber-glow' }, '@tên_mẫu'), ' trong chat để chèn nhanh.'),
              h('div', { className: 'space-y-2 bg-ink-800/30 border border-white/5 rounded-lg p-3' },
                h('input', {
                  type: 'text', value: newTmplName, onChange: e => setNewTmplName(e.target.value),
                  placeholder: 'tên_mẫu (chữ thường, dùng _)',
                  className: 'w-full bg-ink-800/60 border border-white/10 rounded-lg px-3 py-1.5 text-sm text-ink-100 placeholder-ink-500 focus:outline-none focus:border-amber-glow/40 font-mono',
                }),
                h('textarea', {
                  value: newTmplContent, onChange: e => setNewTmplContent(e.target.value),
                  placeholder: 'Nội dung prompt mẫu...',
                  rows: 4,
                  className: 'w-full bg-ink-800/60 border border-white/10 rounded-lg px-3 py-1.5 text-sm text-ink-100 placeholder-ink-500 focus:outline-none focus:border-amber-glow/40 resize-none',
                }),
                h('div', { className: 'flex gap-2' },
                  h('button', {
                    onClick: saveTemplate,
                    disabled: !newTmplName.trim() || !newTmplContent.trim(),
                    className: 'px-3 py-1.5 rounded-lg bg-amber-glow text-ink-950 text-xs font-medium hover:brightness-110 disabled:opacity-40',
                  }, editingId ? 'Cập nhật' : 'Thêm mẫu'),
                  editingId && h('button', {
                    onClick: () => { setEditingId(null); setNewTmplName(''); setNewTmplContent(''); },
                    className: 'px-3 py-1.5 rounded-lg border border-white/10 text-ink-300 text-xs hover:border-white/20',
                  }, 'Hủy'),
                )
              ),
              h('div', { className: 'space-y-1.5' },
                templates.length === 0
                  ? h('p', { className: 'text-center text-ink-500 text-sm py-6' }, 'Chưa có mẫu nào')
                  : templates.map(t => h('div', { key: t.id, className: 'flex items-start gap-2 px-3 py-2 bg-ink-800/40 rounded-lg group' },
                      h('div', { className: 'flex-1 min-w-0' },
                        h('div', { className: 'font-mono text-amber-glow text-xs' }, '@' + t.name),
                        h('div', { className: 'text-[11px] text-ink-300 mt-0.5 line-clamp-2' }, t.content),
                      ),
                      h('div', { className: 'flex gap-1 opacity-0 group-hover:opacity-100 transition' },
                        h('button', {
                          onClick: () => { setEditingId(t.id); setNewTmplName(t.name); setNewTmplContent(t.content); },
                          className: 'text-ink-500 hover:text-amber-glow text-xs',
                        }, 'Sửa'),
                        h('button', {
                          onClick: () => { if (confirm(`Xóa mẫu @${t.name}?`)) onRemoveTemplate(t.id); },
                          className: 'text-ink-500 hover:text-red-400',
                        }, I.trash)
                      )
                    ))
              )
            ),
            tab === 'about' && h('div', { className: 'py-4 space-y-5' },
              h('div', { className: 'text-center' },
                h('div', { className: 'flex items-center justify-center gap-2 text-amber-glow' },
                  I.sparkle,
                  h('h2', { style: { fontFamily: 'Instrument Serif, serif', fontSize: '32px', letterSpacing: '0.05em', margin: 0 } }, 'PMĐ Chat'),
                  I.sparkle,
                ),
                h('p', { className: 'text-sm text-ink-400 mt-1' }, 'Floating AI Chat Assistant'),
                h('div', { className: 'pt-3' },
                  h('div', { className: 'text-[10px] uppercase tracking-wider text-ink-500' }, 'Made by'),
                  h('div', { style: { fontFamily: 'Instrument Serif, serif', fontSize: '22px' }, className: 'text-ink-100' }, 'Phan Minh Đức'),
                ),
                h('div', { className: 'pt-3 grid grid-cols-2 gap-2 max-w-xs mx-auto text-xs text-ink-400' },
                  h('div', { className: 'bg-ink-800/40 rounded-lg px-3 py-2' },
                    h('div', { className: 'text-amber-glow font-medium' }, 'v1.0.0'),
                    h('div', { className: 'text-[10px]' }, 'Phiên bản'),
                  ),
                  h('div', { className: 'bg-ink-800/40 rounded-lg px-3 py-2' },
                    h('div', { className: 'text-amber-glow font-medium' }, 'Electron'),
                    h('div', { className: 'text-[10px]' }, 'Stack'),
                  ),
                ),
              ),

              // ── Donate / Ủng hộ ──
              h('div', { className: 'border-t border-white/10 pt-5' },
                h('div', { className: 'text-center mb-3' },
                  h('div', { className: 'text-amber-glow text-lg flex items-center justify-center gap-1.5 mb-1' },
                    h('span', null, '☕'),
                    h('span', { style: { fontFamily: 'Instrument Serif, serif' } }, 'Ủng hộ tác giả'),
                  ),
                  h('p', { className: 'text-[11px] text-ink-400 max-w-xs mx-auto' },
                    'Nếu thấy app hữu ích, cho tác giả ly cà phê ☕ để tiếp tục phát triển nhé!'
                  ),
                ),
                h('div', { className: 'flex flex-col items-center gap-3 bg-ink-800/30 border border-white/5 rounded-2xl p-3' },
                  h('img', {
                    src: './donate-qr.jpg',
                    className: 'w-full max-w-[220px] rounded-xl',
                    alt: 'Donate QR — VietinBank Phan Minh Đức',
                  }),
                  h('div', { className: 'text-center text-xs space-y-0.5' },
                    h('div', { className: 'text-ink-100 font-semibold tracking-wide' }, 'PHAN MINH DUC'),
                    h('div', { className: 'text-ink-300 font-mono select-all' }, '105872229878'),
                    h('div', { className: 'text-[10px] text-ink-400' }, 'VietinBank · CN Khánh Hòa · PGD Nha Trang'),
                  ),
                  h('button', {
                    onClick: () => {
                      navigator.clipboard.writeText('105872229878');
                      alert('Đã copy số tài khoản: 105872229878');
                    },
                    className: 'text-[11px] px-3 py-1 rounded-lg bg-amber-glow/10 border border-amber-glow/30 text-amber-glow hover:bg-amber-glow/20 transition',
                  }, '📋 Copy số tài khoản'),
                ),
              ),

              h('div', { className: 'pt-3 text-[11px] text-ink-500 max-w-sm mx-auto leading-relaxed text-center' },
                'Trợ lý AI floating bubble với Gemini, Groq, OpenRouter. Tối ưu cho người Việt.'
              ),
              h('div', { className: 'pt-1 flex items-center justify-center gap-1 text-[11px] text-ink-500' },
                'Crafted with ', I.heart, ' in Vietnam'
              ),
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
